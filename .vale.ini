StylesPath = styles
MinAlertLevel = warning
Vocab = Collabase
IgnoredScopes = code, tt, a
SkippedScopes = script, style, pre, figure

[formats]
mdx = md

[*.mdx]
BasedOnStyles = Collabase
TokenIgnores = (?sm)((?:import|export) .+?$), \
(<[A-Z]\w*[^>]*/>), \
(<[A-Z]\w+>.+?</[A-Z]\w+>), \
\{[^}]*\}

# German pages follow section 14 and 15 of the rules, not the English style.
[de/*.mdx]
BasedOnStyles =

[de/**/*.mdx]
BasedOnStyles =
